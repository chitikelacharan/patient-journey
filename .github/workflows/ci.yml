name: Med-Pulse 360 CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONPATH: .

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Run Automated Test Suite (pytest)
      run: |
        python -m pytest -v --tb=short tests/

    - name: Verify Health Probes & App Packaging
      run: |
        python -c "import backend.app.main; print('FastAPI App and Database Loaded Successfully!')"

  docker-build:
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Production Image
      run: |
        docker build -t medpulse-analyzer:latest .
